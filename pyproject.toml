[project]
name = "portfolio-intel"
version = "0.1.0"
description = "Agente de inteligencia de portfolio de IA: prioriza, detecta duplicados/reuso, mide realización de valor y recomienda scale/reduce/consolidate/discontinue sobre el AI Use Case Inventory de la empresa, con LangGraph sobre Databricks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Facundo Mazzola" }]

dependencies = [
    "langgraph>=0.3",
    "langgraph-supervisor>=0.0.9",
    "langchain>=0.3",
    "databricks-langchain>=0.3",
    "databricks-sdk>=0.30",
    "mlflow[databricks]>=3.1.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_intel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# dbutils/spark/display son globals que Databricks inyecta en tiempo de
# ejecución de un notebook -- ruff no los conoce fuera de Databricks, pero
# son válidos ahí. F821 = undefined name.
"notebooks/*.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requiere una conexión real a Databricks (LLM + SQL warehouse) -- no",
    "    corre en esta máquina de desarrollo, solo en la compu de trabajo.",
]
