[project]
name = "finhive"
version = "0.1.0"
description = "Sistema multiagente jerárquico de análisis financiero sobre LangGraph y Databricks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matías Adell" }]

dependencies = [
    "langgraph>=0.3",
    "langgraph-supervisor>=0.0.9",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "databricks-langchain>=0.3",
    "databricks-sdk>=0.30",
    "databricks-vectorsearch>=0.40",
    "mlflow>=2.16",
    "langsmith>=0.1",
    "streamlit>=1.38",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finhive"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
