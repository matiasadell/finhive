[project]
name = "portfolio-intel"
version = "0.1.0"
description = "Agente de inteligencia de portfolio de IA: prioriza, detecta duplicados/reuso, mide realización de valor y recomienda scale/reduce/consolidate/discontinue sobre el AI Use Case Inventory de la empresa, con LangGraph sobre Databricks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Facundo Mazzola" }]

dependencies = [
    # Pisos de versión más altos que "lo mínimo que alcanza" en el
    # ecosistema langgraph/langchain, no arbitrarios: la resolución más
    # suelta que se probó en esta máquina de desarrollo (contra Python
    # 3.11, ver nota abajo) mezcló versiones incompatibles entre sí
    # (`langgraph-prebuilt` más nuevo que lo que soportaba el `langgraph`
    # core resuelto, `ImportError: cannot import name 'ExecutionInfo' from
    # 'langgraph.runtime'`) hasta subir estos pisos -- verificado
    # end-to-end con `langgraph==1.2.11` + `langchain==1.3.18` (grafo
    # completo compila y falla limpio recién en la llamada real a
    # Databricks, ver `prompts/constraints_environment.md`). No se fijaron
    # como pines exactos (`==`) porque eso rompe la resolución desde cero
    # (`langchain==1.2.10` declara `langgraph<1.1.0`, conflicto de
    # metadata) -- estos mínimos alcanzan para que `pip`/`uv` converjan
    # solos a una combinación consistente.
    "langgraph>=1.2",
    "langgraph-supervisor>=0.0.31",
    "langchain>=1.3",
    "databricks-langchain>=0.20",
    "databricks-sdk>=0.30",
    "databricks-agents>=0.15",  # infra/databricks/deploy_agent.py (`from databricks import agents`)
    "mlflow[databricks]>=3.1.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_intel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# dbutils/spark/display son globals que Databricks inyecta en tiempo de
# ejecución de un notebook -- ruff no los conoce fuera de Databricks, pero
# son válidos ahí. F821 = undefined name.
"notebooks/*.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "not live" por default: los tests marcados `live` necesitan una conexión
# real a Databricks (LLM + SQL warehouse) que esta máquina de desarrollo no
# tiene (ver prompts/constraints_environment.md) -- correrlos a mano en la
# compu de trabajo con `pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: requiere una conexión real a Databricks (LLM + SQL warehouse) -- correr a mano en la compu de trabajo, no acá.",
]
